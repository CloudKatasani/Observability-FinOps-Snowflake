[project]
name = "snowobs-worker"
version = "0.1.0"
description = "Background job worker (arq) for the Observability & FinOps Platform for Snowflake"
requires-python = ">=3.12"
dependencies = [
    "snowobs-common",
    "arq>=0.26",
    "redis>=5.2",
]

[tool.uv.sources]
snowobs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_worker"]
