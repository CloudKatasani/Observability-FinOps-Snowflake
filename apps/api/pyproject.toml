[project]
name = "snowobs-api"
version = "0.1.0"
description = "FastAPI service for the Observability & FinOps Platform for Snowflake"
requires-python = ">=3.12"
dependencies = [
    "snowobs-common",
    "snowobs-semantics",
    "snowobs-ingest",
    "snowobs-engines",
    "snowobs-finops",
    "snowobs-live",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "redis>=5.2",
]

[tool.uv.sources]
snowobs-common = { workspace = true }
snowobs-semantics = { workspace = true }
snowobs-ingest = { workspace = true }
snowobs-engines = { workspace = true }
snowobs-finops = { workspace = true }
snowobs-live = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_api"]
