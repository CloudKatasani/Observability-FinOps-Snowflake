# Local deployment (BUILD_PROMPT §19). Run from the repository root:
#   docker compose -f deploy/compose/docker-compose.yml up -d
name: snowobs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snowobs
      POSTGRES_PASSWORD: snowobs
      POSTGRES_DB: snowobs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowobs -d snowobs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: snowobs
      MINIO_ROOT_PASSWORD: snowobs-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 snowobs snowobs-dev-secret &&
      mc mb --ignore-existing local/snowobs
      "

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://snowobs:snowobs@postgres:5432/snowobs
      REDIS_URL: redis://redis:6379/0
      STORAGE__PROVIDER: minio
      STORAGE__BUCKET: snowobs
      STORAGE__ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://snowobs:snowobs@postgres:5432/snowobs
      REDIS_URL: redis://redis:6379/0
      STORAGE__PROVIDER: minio
      STORAGE__BUCKET: snowobs
      STORAGE__ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
