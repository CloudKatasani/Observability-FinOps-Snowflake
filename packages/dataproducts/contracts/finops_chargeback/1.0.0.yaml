product_id: finops_chargeback
product_name: Platform Cost & Attribution
version: 1.0.0
owner: finops-platform
domain: chargeback
classification: confidential
freshness_guarantee_minutes: 480
availability_pct: '99.5'
retention_days: 365
support_channel: finops-platform@internal
deprecation_notice_days: 90
breaking_change_policy: 'Removing a column, changing its type, relaxing its nullability, rebinding it
  to a different governed metric, changing the grain, loosening the freshness guarantee, or shortening
  retention is a BREAKING change: it requires a major version, a migration note, and the full deprecation
  notice period. Everything else is additive and ships as a minor or patch version.'
datasets:
- name: V_FINOPS_CHARGEBACK_QUERY_EXECUTION
  entity: fact_query_execution
  description: 'Platform Cost & Attribution: Query execution.'
  grain:
  - TIME_BUCKET
  - TEAM
  - WAREHOUSE
  - DATABASE
  - ALLOCATION_METHOD
  time_grain: day
  columns:
  - name: TIME_BUCKET
    type: TIMESTAMP_LTZ
    nullable: false
    description: Time bucket over STARTED_AT, at the coarsest grain the product's metrics declare.
    metric_id: null
    unit: null
    sensitive: false
    searchable: false
  - name: TEAM
    type: STRING
    nullable: true
    description: Team from the query tag; UNATTRIBUTED when the tag is absent.
    metric_id: null
    unit: null
    sensitive: false
    searchable: true
  - name: WAREHOUSE
    type: STRING
    nullable: true
    description: Warehouse the query ran on.
    metric_id: null
    unit: null
    sensitive: false
    searchable: true
  - name: DATABASE
    type: STRING
    nullable: true
    description: Database context of the query.
    metric_id: null
    unit: null
    sensitive: false
    searchable: true
  - name: ALLOCATION_METHOD
    type: STRING
    nullable: true
    description: 'How the query''s credits reach a team — directly from its own tag, or via the residual
      pool spread pro-rata over tagged usage (HLD §10.2).

      '
    metric_id: null
    unit: null
    sensitive: false
    searchable: true
  - name: CHARGEBACK_ALLOCATED_CREDITS
    type: NUMBER(38,9)
    nullable: true
    description: Credits allocated to a team by its own query tags — the direct component of the three-part
      model (direct + idle share + cloud-services share, HLD §10.2). Read alone it under-states a team's
      true cost, because idle time and cloud services are not attributable per query; it is the component
      that can be defended query by query, which is why it is stated separately.
    metric_id: chargeback.allocated_credits
    unit: credits
    sensitive: false
    searchable: false
  - name: COST_BY_TEAM_CREDITS
    type: NUMBER(38,9)
    nullable: true
    description: Directly attributed credits by team, from the query tag. This is the direct component
      only — the full chargeback figure adds idle and cloud-services shares (see the allocation engine).
    metric_id: cost.by_team_credits
    unit: credits
    sensitive: false
    searchable: false
  - name: CHARGEBACK_UNATTRIBUTED_CREDITS
    type: NUMBER(38,9)
    nullable: true
    description: 'Attributed credits carrying no team tag. This is the residual pool: it has to be spread
      over the tagged teams pro-rata, which means every credit here is a credit somebody is being charged
      for on an estimate rather than on evidence. Sliced by warehouse and user it becomes a tagging backlog.'
    metric_id: chargeback.unattributed_credits
    unit: credits
    sensitive: false
    searchable: false
  - name: CHARGEBACK_UNATTRIBUTED_SHARE
    type: NUMBER(38,15)
    nullable: true
    description: 'Fraction of allocated credits that reached a team by estimate rather than by tag. It
      is the confidence figure that belongs next to every chargeback statement: at 5% the allocation is
      defensible, at 30% it is a negotiation.'
    metric_id: chargeback.unattributed_share
    unit: null
    sensitive: false
    searchable: false
  freshness_minutes: 480
  expected_min_rows_per_day: 1
  expected_max_rows_per_day: null
  sources:
  - query_attribution_history
  - query_history
- name: V_FINOPS_CHARGEBACK_COST_DAILY
  entity: fact_cost_daily
  description: 'Platform Cost & Attribution: Cost by service type (daily).'
  grain:
  - TIME_BUCKET
  - SERVICE_TYPE
  time_grain: day
  columns:
  - name: TIME_BUCKET
    type: DATE
    nullable: false
    description: Time bucket over USAGE_DAY, at the coarsest grain the product's metrics declare.
    metric_id: null
    unit: null
    sensitive: false
    searchable: false
  - name: SERVICE_TYPE
    type: STRING
    nullable: true
    description: Snowflake service type (WAREHOUSE_METERING, SERVERLESS_TASK, AI_SERVICES, …).
    metric_id: null
    unit: null
    sensitive: false
    searchable: true
  - name: CHARGEBACK_METERED_CREDITS
    type: NUMBER(38,9)
    nullable: true
    description: The account's metered credits by service type — the control total every allocation must
      sum back to. It is stated in this domain, rather than borrowed from D1, because the reconciliation
      gate needs both sides of the comparison to carry the same provenance and the same latency floor.
    metric_id: chargeback.metered_credits
    unit: credits
    sensitive: false
    searchable: false
  freshness_minutes: 180
  expected_min_rows_per_day: 1
  expected_max_rows_per_day: null
  sources:
  - metering_daily_history
- name: V_FINOPS_CHARGEBACK_WAREHOUSE_METERING_HOURLY
  entity: fact_warehouse_metering_hourly
  description: 'Platform Cost & Attribution: Warehouse metering (hourly).'
  grain:
  - TIME_BUCKET
  - WAREHOUSE
  time_grain: hour
  columns:
  - name: TIME_BUCKET
    type: TIMESTAMP_LTZ
    nullable: false
    description: Time bucket over METERING_HOUR, at the coarsest grain the product's metrics declare.
    metric_id: null
    unit: null
    sensitive: false
    searchable: false
  - name: WAREHOUSE
    type: STRING
    nullable: true
    description: Warehouse the credits were metered against.
    metric_id: null
    unit: null
    sensitive: false
    searchable: true
  - name: CHARGEBACK_RECONCILIATION_VARIANCE
    type: NUMBER(38,9)
    nullable: true
    description: 'Metered warehouse compute minus the compute attributable to individual queries. The
      gap is expected, not an error: QUERY_ATTRIBUTION_HISTORY excludes idle time, queries under about
      100 ms, and Adaptive Warehouse jobs (ASSUMPTIONS §5). What the reconciliation gate checks is that
      the gap stays explainable — a variance that grows without idle time growing means the attribution
      view has stopped seeing part of the workload.'
    metric_id: chargeback.reconciliation_variance
    unit: credits
    sensitive: false
    searchable: false
  freshness_minutes: 480
  expected_min_rows_per_day: 1
  expected_max_rows_per_day: null
  sources:
  - query_attribution_history
  - warehouse_metering_history
