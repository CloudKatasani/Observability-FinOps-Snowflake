[project]
name = "snowobs-dataproducts"
version = "0.1.0"
description = "Data product registry, contracts, artifact emitters, and the approval-gated publish workflow"
requires-python = ">=3.12"
dependencies = [
    "snowobs-common",
    "snowobs-semantics",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "sqlglot>=26.0",
]

[tool.uv.sources]
snowobs-common = { workspace = true }
snowobs-semantics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_dataproducts"]
