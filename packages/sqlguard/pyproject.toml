[project]
name = "snowobs-sqlguard"
version = "0.1.0"
description = "Mandatory SQL guard: parse, restrict, limit, and pin every statement (R9)"
requires-python = ">=3.12"
dependencies = ["snowobs-common", "sqlglot>=26.0"]

[tool.uv.sources]
snowobs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_sqlguard"]
