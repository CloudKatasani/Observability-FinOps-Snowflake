[project]
name = "snowobs-live"
version = "0.1.0"
description = "LIVE mode: Snowflake connections, capability probe, provisioning SQL, pushdown execution"
requires-python = ">=3.12"
dependencies = [
    "snowobs-common",
    "snowobs-semantics",
    "snowobs-sqlguard",
    "snowobs-engines",
    "snowflake-connector-python>=4.7",
    "cryptography>=44",
]

[tool.uv.sources]
snowobs-common = { workspace = true }
snowobs-semantics = { workspace = true }
snowobs-sqlguard = { workspace = true }
snowobs-engines = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_live"]
