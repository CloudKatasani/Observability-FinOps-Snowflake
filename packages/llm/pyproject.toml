[project]
name = "snowobs-llm"
version = "0.1.0"
description = "LLM provider adapter: Anthropic, Bedrock, Snowflake Cortex, and a deterministic no-key mode"
requires-python = ">=3.12"
dependencies = ["snowobs-common", "pydantic>=2.10"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
bedrock = ["boto3>=1.35"]

[tool.uv.sources]
snowobs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_llm"]
