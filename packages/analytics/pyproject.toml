[project]
name = "snowobs-analytics"
version = "0.1.0"
description = "Forecasting, anomaly detection, right-sizing, optimisation levers, and savings claims"
requires-python = ">=3.12"
dependencies = ["snowobs-common", "snowobs-semantics", "pydantic>=2.10"]

[tool.uv.sources]
snowobs-common = { workspace = true }
snowobs-semantics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_analytics"]
