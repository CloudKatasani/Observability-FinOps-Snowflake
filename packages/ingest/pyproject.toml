[project]
name = "snowobs-ingest"
version = "0.1.0"
description = "Offline ingestion: profile, identify, map, validate, land, drift, catalog"
requires-python = ">=3.12"
dependencies = [
    "snowobs-common",
    "snowobs-semantics",
    "duckdb>=1.1",
    "polars>=1.17",
    "pyarrow>=18.1",
]

[tool.uv.sources]
snowobs-common = { workspace = true }
snowobs-semantics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_ingest"]
