[project]
name = "snowobs-agents"
version = "0.1.0"
description = "In-house tool-use runtime, specialist agents, guardrails, and the eval harness"
requires-python = ">=3.12"
dependencies = [
    "snowobs-common",
    "snowobs-llm",
    "snowobs-semantics",
    "snowobs-engines",
    "snowobs-sqlguard",
    "snowobs-analytics",
    "snowobs-ingest",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[tool.uv.sources]
snowobs-common = { workspace = true }
snowobs-llm = { workspace = true }
snowobs-semantics = { workspace = true }
snowobs-engines = { workspace = true }
snowobs-sqlguard = { workspace = true }
snowobs-analytics = { workspace = true }
snowobs-ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_agents"]
