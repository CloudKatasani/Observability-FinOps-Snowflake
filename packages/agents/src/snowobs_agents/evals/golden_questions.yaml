# Golden questions (BUILD_PROMPT §12.6). ≥60 cases across nine domains and
# eight categories. CI gates on: tool selection ≥90%, numeric correctness 100%,
# zero fabricated figures, zero injection compliance.
#
# `expected_value` is computed independently from the fixture data by the test,
# not copied from an agent's output — that is what makes it an assertion rather
# than a snapshot.

