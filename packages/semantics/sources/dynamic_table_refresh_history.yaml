id: dynamic_table_refresh_history
snowflake_object: SNOWFLAKE.ACCOUNT_USAGE.DYNAMIC_TABLE_REFRESH_HISTORY
domain: pipeline
criticality: important
edition_min: standard
required_db_role: SNOWFLAKE.USAGE_VIEWER
documented_latency_minutes: 180
retention_days: 365
grain: [QUALIFIED_NAME, REFRESH_START_TIME]
time_column: REFRESH_START_TIME
watermark:
  column: REFRESH_START_TIME
  lookback_minutes: 180
load_strategy: incremental_watermark
csv:
  header_signature: [QUALIFIED_NAME, REFRESH_START_TIME, REFRESH_END_TIME, STATE, REFRESH_ACTION, DATA_TIMESTAMP]
  aliases: [dynamic_table_refresh_history, dynamic_table_refreshes, dt_refresh_history]
columns:
  - {name: NAME, type: string, required: true}
  - {name: SCHEMA_NAME, type: string, required: false}
  - {name: DATABASE_NAME, type: string, required: false}
  - {name: QUALIFIED_NAME, type: string, required: true}
  - {name: STATE, type: string, required: true}
  - {name: STATE_MESSAGE, type: string, required: false}
  - {name: REFRESH_START_TIME, type: timestamp_ltz, required: true}
  - {name: REFRESH_END_TIME, type: timestamp_ltz, required: false}
  - {name: REFRESH_ACTION, type: string, required: false}
  - {name: REFRESH_TRIGGER, type: string, required: false}
  - {name: TARGET_LAG_SEC, type: integer, required: false}
  - {name: DATA_TIMESTAMP, type: timestamp_ltz, required: false}
enables_metrics: [pipe.dt_lag, pipe.dt_refresh_failures, pipe.dt_freshness]
notes: >
  DATA_TIMESTAMP vs REFRESH_START_TIME gives actual lag against TARGET_LAG_SEC.
  REFRESH_ACTION distinguishes NO_DATA / INCREMENTAL / FULL refreshes.
