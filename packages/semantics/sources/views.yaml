id: views
snowflake_object: SNOWFLAKE.ACCOUNT_USAGE.VIEWS
domain: catalog
criticality: optional
edition_min: standard
required_db_role: SNOWFLAKE.OBJECT_VIEWER
documented_latency_minutes: 90
retention_days: 0
grain: [TABLE_ID]
time_column: null
load_strategy: full_snapshot
csv:
  header_signature: [TABLE_ID, TABLE_NAME, TABLE_SCHEMA, TABLE_CATALOG, VIEW_DEFINITION, IS_SECURE]
  aliases: [views, views_export, views_snapshot]
columns:
  - {name: TABLE_ID, type: string, required: true}
  - {name: TABLE_NAME, type: string, required: true}
  - {name: TABLE_SCHEMA, type: string, required: false}
  - {name: TABLE_CATALOG, type: string, required: false}
  - {name: TABLE_OWNER, type: string, required: false}
  - {name: VIEW_DEFINITION, type: string, required: false}
  - {name: IS_SECURE, type: string, required: false}
  - {name: CREATED, type: timestamp_ltz, required: false}
  - {name: LAST_ALTERED, type: timestamp_ltz, required: false}
  - {name: DELETED, type: timestamp_ltz, required: false}
sensitivity:
  VIEW_DEFINITION: restricted   # free-text SQL, may embed literals (§12.5)
enables_metrics: [catalog.view_inventory, gov.secure_view_coverage]
notes: >
  Dimension snapshot including dropped views (DELETED set). IS_SECURE is
  YES/NO text. Latency verified 2026-08-24.
