id: materialized_view_refresh_history
snowflake_object: SNOWFLAKE.ACCOUNT_USAGE.MATERIALIZED_VIEW_REFRESH_HISTORY
domain: cost
criticality: important
edition_min: standard
required_db_role: SNOWFLAKE.USAGE_VIEWER
documented_latency_minutes: 180
retention_days: 365
grain: [MATERIALIZED_VIEW_ID, START_TIME]
time_column: START_TIME
watermark:
  column: START_TIME
  lookback_minutes: 180
load_strategy: incremental_watermark
csv:
  header_signature: [MATERIALIZED_VIEW_ID, MATERIALIZED_VIEW_NAME, START_TIME, END_TIME, CREDITS_USED]
  aliases: [materialized_view_refresh_history, mv_refresh_history]
columns:
  - {name: START_TIME, type: timestamp_ltz, required: true}
  - {name: END_TIME, type: timestamp_ltz, required: false}
  - {name: CREDITS_USED, type: number, required: true}
  - {name: MATERIALIZED_VIEW_ID, type: string, required: true}
  - {name: MATERIALIZED_VIEW_NAME, type: string, required: true}
  - {name: SCHEMA_ID, type: string, required: false}
  - {name: SCHEMA_NAME, type: string, required: false}
  - {name: DATABASE_ID, type: string, required: false}
  - {name: DATABASE_NAME, type: string, required: false}
enables_metrics: [cost.serverless, cost.mv_refresh]
