id: pipes
snowflake_object: SNOWFLAKE.ACCOUNT_USAGE.PIPES
domain: pipeline
criticality: important
edition_min: standard
required_db_role: SNOWFLAKE.USAGE_VIEWER
documented_latency_minutes: 120
retention_days: 0
grain: [PIPE_ID]
time_column: null
load_strategy: full_snapshot
csv:
  header_signature: [PIPE_ID, PIPE_NAME, PIPE_SCHEMA, PIPE_CATALOG, DEFINITION]
  aliases: [pipes, pipes_snapshot]
columns:
  - {name: PIPE_ID, type: string, required: true}
  - {name: PIPE_NAME, type: string, required: true}
  - {name: PIPE_SCHEMA, type: string, required: true}
  - {name: PIPE_CATALOG, type: string, required: true}
  - {name: DEFINITION, type: string, required: false}
  - {name: IS_AUTOINGEST_ENABLED, type: string, required: false}
  - {name: NOTIFICATION_CHANNEL_NAME, type: string, required: false}
  - {name: CREATED, type: timestamp_ltz, required: false}
  - {name: LAST_ALTERED, type: timestamp_ltz, required: false}
enables_metrics: [pipe.inventory, cost.snowpipe]
notes: >
  Pipe catalog snapshot joined to PIPE_USAGE_HISTORY/COPY_HISTORY by PIPE_ID.
  IS_AUTOINGEST_ENABLED is documented as YES/NO text, not a boolean.
