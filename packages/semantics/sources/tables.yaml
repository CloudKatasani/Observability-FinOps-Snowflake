id: tables
snowflake_object: SNOWFLAKE.ACCOUNT_USAGE.TABLES
domain: catalog
criticality: important
edition_min: standard
required_db_role: SNOWFLAKE.OBJECT_VIEWER
documented_latency_minutes: 90
retention_days: 0
grain: [TABLE_ID]
time_column: null
load_strategy: full_snapshot
csv:
  header_signature: [TABLE_ID, TABLE_NAME, TABLE_SCHEMA, TABLE_CATALOG, TABLE_TYPE, ROW_COUNT]
  aliases: [tables, tables_export, tables_snapshot]
columns:
  - {name: TABLE_ID, type: string, required: true}
  - {name: TABLE_NAME, type: string, required: true}
  - {name: TABLE_SCHEMA_ID, type: string, required: false}
  - {name: TABLE_SCHEMA, type: string, required: false}
  - {name: TABLE_CATALOG_ID, type: string, required: false}
  - {name: TABLE_CATALOG, type: string, required: false}
  - {name: TABLE_OWNER, type: string, required: false}
  - {name: TABLE_TYPE, type: string, required: false}
  - {name: IS_TRANSIENT, type: string, required: false}
  - {name: CLUSTERING_KEY, type: string, required: false}
  - {name: ROW_COUNT, type: number, required: false}
  - {name: BYTES, type: number, required: false}
  - {name: RETENTION_TIME, type: integer, required: false}
  - {name: CREATED, type: timestamp_ltz, required: false}
  - {name: LAST_ALTERED, type: timestamp_ltz, required: false}
  - {name: LAST_DDL, type: timestamp_ltz, required: false}
  - {name: DELETED, type: timestamp_ltz, required: false}
  - {name: AUTO_CLUSTERING_ON, type: string, required: false}
enables_metrics: [catalog.table_inventory, opt.clustering_*, storage.by_table, gov.stale_tables]
notes: >
  Dimension snapshot including dropped tables (DELETED set). Joins to
  TABLE_STORAGE_METRICS on TABLE_ID = ID. AUTO_CLUSTERING_ON is YES/NO text.
  Latency verified 2026-08-24.
