id: data_transfer_daily_history
snowflake_object: SNOWFLAKE.ORGANIZATION_USAGE.DATA_TRANSFER_DAILY_HISTORY
domain: cost
scope: organization
criticality: important
edition_min: standard
required_db_role: SNOWFLAKE.ORGANIZATION_USAGE_VIEWER
documented_latency_minutes: 1440
retention_days: 365
grain: [ACCOUNT_NAME, USAGE_DATE, TRANSFER_TYPE]
time_column: USAGE_DATE
watermark:
  column: USAGE_DATE
  lookback_minutes: 2880   # daily grain — re-read two days
load_strategy: incremental_watermark
csv:
  header_signature: [ACCOUNT_NAME, USAGE_DATE, TRANSFER_TYPE, BYTES_TRANSFERRED]
  aliases: [data_transfer_daily_history, org_data_transfer_daily]
columns:
  - {name: ORGANIZATION_NAME, type: string, required: false}
  - {name: ACCOUNT_NAME, type: string, required: true}
  - {name: ACCOUNT_LOCATOR, type: string, required: false}
  - {name: REGION, type: string, required: false}
  - {name: USAGE_DATE, type: date, required: true}
  - {name: TARGET_CLOUD, type: string, required: false}
  - {name: TARGET_REGION, type: string, required: false}
  - {name: TRANSFER_TYPE, type: string, required: true}
  - {name: BYTES_TRANSFERRED, type: number, required: true}
enables_metrics: [cost.egress, cost.org_data_transfer]
notes: >
  Org-wide daily data-transfer per account. Requires ORGADMIN-enabled account
  or the organization account (ASSUMPTIONS §2).
