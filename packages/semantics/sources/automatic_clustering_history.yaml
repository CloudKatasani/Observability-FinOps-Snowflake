id: automatic_clustering_history
snowflake_object: SNOWFLAKE.ACCOUNT_USAGE.AUTOMATIC_CLUSTERING_HISTORY
domain: cost
criticality: important
edition_min: standard
required_db_role: SNOWFLAKE.USAGE_VIEWER
documented_latency_minutes: 180
retention_days: 365
grain: [TABLE_ID, START_TIME]
time_column: START_TIME
watermark:
  column: START_TIME
  lookback_minutes: 180
load_strategy: incremental_watermark
csv:
  header_signature: [TABLE_ID, TABLE_NAME, START_TIME, CREDITS_USED, NUM_BYTES_RECLUSTERED]
  aliases: [automatic_clustering_history, auto_clustering, clustering_history]
columns:
  - {name: START_TIME, type: timestamp_ltz, required: true}
  - {name: END_TIME, type: timestamp_ltz, required: false}
  - {name: CREDITS_USED, type: number, required: true}
  - {name: NUM_BYTES_RECLUSTERED, type: number, required: true}
  - {name: NUM_ROWS_RECLUSTERED, type: number, required: true}
  - {name: TABLE_ID, type: string, required: true}
  - {name: TABLE_NAME, type: string, required: true}
  - {name: SCHEMA_ID, type: string, required: false}
  - {name: SCHEMA_NAME, type: string, required: false}
  - {name: DATABASE_ID, type: string, required: false}
  - {name: DATABASE_NAME, type: string, required: false}
enables_metrics: [cost.serverless, cost.clustering, opt.clustering_*]
