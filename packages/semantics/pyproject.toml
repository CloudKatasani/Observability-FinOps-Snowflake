[project]
name = "snowobs-semantics"
version = "0.1.0"
description = "Single source of truth: source registry, entities, metrics, allocation config, and the dual-dialect SQL compiler"
requires-python = ">=3.12"
dependencies = [
    "snowobs-common",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "sqlglot>=26.0",
]

[tool.uv.sources]
snowobs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_semantics"]
