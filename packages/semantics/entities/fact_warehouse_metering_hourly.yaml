id: fact_warehouse_metering_hourly
name: Warehouse metering (hourly)
kind: fact
description: >
  One row per warehouse per hour of metered compute, with attributed and idle
  credits derived by joining query attribution. Idle credits are the difference
  between metered and attributed compute — the basis of the idle-share
  allocation component (HLD §10.2).

  Both joins, and the whole-window rank, match on the account as well as the
  warehouse: every account in a fleet runs a warehouse called TRANSFORM_WH, and
  matching on the name alone would attribute one account's queries to another's
  metering and rank four accounts' warehouses against each other. The account
  comparison is null-safe, so a single-account lake — where nothing stamped an
  account — behaves exactly as it did before.
sources: [warehouse_metering_history, query_attribution_history]
grain: [WAREHOUSE_NAME, METERING_HOUR]
time_column: METERING_HOUR
sql: |
  SELECT
    m."WAREHOUSE_NAME"                                    AS WAREHOUSE_NAME,
    m."WAREHOUSE_ID"                                      AS WAREHOUSE_ID,
    TS_TRUNC('hour', TS_PARSE(m."START_TIME"))            AS METERING_HOUR,
    MONEY(m."CREDITS_USED_COMPUTE")                       AS CREDITS_COMPUTE,
    MONEY(m."CREDITS_USED_CLOUD_SERVICES")                AS CREDITS_CLOUD_SERVICES,
    MONEY(COALESCE(a.CREDITS_ATTRIBUTED, 0))              AS CREDITS_ATTRIBUTED,
    MONEY(m."CREDITS_USED_COMPUTE" - COALESCE(a.CREDITS_ATTRIBUTED, 0))
                                                          AS CREDITS_IDLE,
    -- Whole-window rank by total compute, so concentration metrics can ask for
    -- "the top N warehouses" without a correlated subquery per row.
    r.WAREHOUSE_RANK                                      AS WAREHOUSE_RANK,
    -- The account these rows came from (see the ACCOUNT_OF shim).
    ACCOUNT_OF(m)                                         AS ACCOUNT_NAME
  FROM warehouse_metering_history AS m
  LEFT JOIN (
    SELECT
      "WAREHOUSE_NAME"                                    AS WAREHOUSE_NAME,
      TS_TRUNC('hour', TS_PARSE("START_TIME"))            AS ATTRIBUTION_HOUR,
      ACCOUNT_OF()                                        AS ACCOUNT_NAME,
      SUM(MONEY("CREDITS_ATTRIBUTED_COMPUTE"))            AS CREDITS_ATTRIBUTED
    FROM query_attribution_history
    GROUP BY 1, 2, 3
  ) AS a
    ON a.WAREHOUSE_NAME = m."WAREHOUSE_NAME"
   AND a.ATTRIBUTION_HOUR = TS_TRUNC('hour', TS_PARSE(m."START_TIME"))
   AND COALESCE(a.ACCOUNT_NAME, '') = COALESCE(ACCOUNT_OF(m), '')
  LEFT JOIN (
    SELECT
      "WAREHOUSE_NAME"                                    AS WAREHOUSE_NAME,
      ACCOUNT_OF()                                        AS ACCOUNT_NAME,
      DENSE_RANK() OVER (
        PARTITION BY ACCOUNT_OF()
        ORDER BY SUM("CREDITS_USED_COMPUTE") DESC
      )                                                   AS WAREHOUSE_RANK
    FROM warehouse_metering_history
    GROUP BY 1, 2
  ) AS r
    ON r.WAREHOUSE_NAME = m."WAREHOUSE_NAME"
   AND COALESCE(r.ACCOUNT_NAME, '') = COALESCE(ACCOUNT_OF(m), '')
dimensions:
  - name: account
    expression: ACCOUNT_NAME
    description: Snowflake account the credits were metered in.
  - name: warehouse
    expression: WAREHOUSE_NAME
    description: Warehouse the credits were metered against.
  - name: metering_hour
    expression: METERING_HOUR
    description: Hour of metering.
