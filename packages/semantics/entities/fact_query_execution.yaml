id: fact_query_execution
name: Query execution
kind: fact
description: >
  One row per query, joined to its attributed compute credits. Carries the
  performance signals the engineering deep-dive ranks on: pruning efficiency,
  spill, queueing, and the team the query is attributed to by the query tag.
sources: [query_history, query_attribution_history]
grain: [QUERY_ID]
time_column: STARTED_AT
sql: |
  SELECT
    q."QUERY_ID"                                          AS QUERY_ID,
    TS_PARSE(q."START_TIME")                              AS STARTED_AT,
    q."WAREHOUSE_NAME"                                    AS WAREHOUSE_NAME,
    q."WAREHOUSE_SIZE"                                    AS WAREHOUSE_SIZE,
    q."USER_NAME"                                         AS USER_NAME,
    q."ROLE_NAME"                                         AS ROLE_NAME,
    q."DATABASE_NAME"                                     AS DATABASE_NAME,
    q."QUERY_TYPE"                                        AS QUERY_TYPE,
    q."EXECUTION_STATUS"                                  AS EXECUTION_STATUS,
    q."ERROR_CODE"                                        AS ERROR_CODE,
    q."QUERY_PARAMETERIZED_HASH"                          AS FINGERPRINT,
    JSON_GET(q."QUERY_TAG", 'team')                       AS QUERY_TAG_TEAM,
    q."TOTAL_ELAPSED_TIME"                                AS ELAPSED_MS,
    q."COMPILATION_TIME"                                  AS COMPILATION_MS,
    q."EXECUTION_TIME"                                    AS EXECUTION_MS,
    q."QUEUED_OVERLOAD_TIME"                              AS QUEUED_OVERLOAD_MS,
    q."QUEUED_PROVISIONING_TIME"                          AS QUEUED_PROVISIONING_MS,
    q."BYTES_SCANNED"                                     AS BYTES_SCANNED,
    q."BYTES_SPILLED_TO_LOCAL_STORAGE"                    AS BYTES_SPILLED_LOCAL,
    q."BYTES_SPILLED_TO_REMOTE_STORAGE"                   AS BYTES_SPILLED_REMOTE,
    q."PARTITIONS_SCANNED"                                AS PARTITIONS_SCANNED,
    q."PARTITIONS_TOTAL"                                  AS PARTITIONS_TOTAL,
    q."PERCENTAGE_SCANNED_FROM_CACHE"                     AS CACHE_FRACTION,
    MONEY(COALESCE(a."CREDITS_ATTRIBUTED_COMPUTE", 0))    AS CREDITS_ATTRIBUTED,
    -- Landing time: its gap from STARTED_AT is this platform's own freshness.
    TS_PARSE(q."_LOADED_AT")                              AS LANDED_AT,
    -- Which account these rows came from. A stamped column OFFLINE, where one
    -- lake holds several accounts; the connection LIVE, where it is not in the
    -- data at all (see the ACCOUNT_OF shim).
    ACCOUNT_OF(q)                                         AS ACCOUNT_NAME
  FROM query_history AS q
  LEFT JOIN query_attribution_history AS a
    ON a."QUERY_ID" = q."QUERY_ID"
dimensions:
  - name: account
    expression: ACCOUNT_NAME
    description: Snowflake account the query ran in.
  - name: warehouse
    expression: WAREHOUSE_NAME
    description: Warehouse the query ran on.
  - name: warehouse_size
    expression: WAREHOUSE_SIZE
    description: Warehouse size at execution time.
  - name: user
    expression: USER_NAME
    description: User who issued the query.
  - name: role
    expression: ROLE_NAME
    description: Role active for the query.
  - name: database
    expression: DATABASE_NAME
    description: Database context of the query.
  - name: query_type
    expression: QUERY_TYPE
    description: Statement type (SELECT, MERGE, COPY, …).
  - name: execution_status
    expression: EXECUTION_STATUS
    description: SUCCESS, FAIL, or INCIDENT.
  - name: error_class
    expression: COALESCE(ERROR_CODE, 'NONE')
    description: Snowflake error code, or NONE for successful queries.
  - name: fingerprint
    expression: FINGERPRINT
    description: Parameterised query hash — the unit of offender ranking.
  - name: team
    expression: COALESCE(QUERY_TAG_TEAM, 'UNATTRIBUTED')
    description: Team from the query tag; UNATTRIBUTED when the tag is absent.
  - name: allocation_method
    expression: >
      CASE WHEN QUERY_TAG_TEAM IS NULL THEN 'RESIDUAL_POOL' ELSE 'DIRECT_TAG' END
    description: >
      How the query's credits reach a team — directly from its own tag, or via
      the residual pool spread pro-rata over tagged usage (HLD §10.2).
