id: fact_dynamic_table_refresh
name: Dynamic table refresh
kind: fact
description: >
  One row per dynamic-table refresh from DYNAMIC_TABLE_REFRESH_HISTORY. The
  column that matters is ACTUAL_LAG_SEC: the distance between the data the
  refresh was built from (DATA_TIMESTAMP) and the moment it started
  (REFRESH_START_TIME). Compared against TARGET_LAG_SEC it is the freshness SLA,
  stated by the pipeline itself rather than inferred from a schedule.
sources: [dynamic_table_refresh_history]
grain: [QUALIFIED_NAME, REFRESH_START_AT]
time_column: REFRESH_START_AT
sql: |
  SELECT
    "QUALIFIED_NAME"                                      AS QUALIFIED_NAME,
    "NAME"                                                AS DYNAMIC_TABLE_NAME,
    "DATABASE_NAME"                                       AS DATABASE_NAME,
    "SCHEMA_NAME"                                         AS SCHEMA_NAME,
    "STATE"                                               AS REFRESH_STATE,
    "STATE_MESSAGE"                                       AS STATE_MESSAGE,
    "REFRESH_ACTION"                                      AS REFRESH_ACTION,
    "REFRESH_TRIGGER"                                     AS REFRESH_TRIGGER,
    "TARGET_LAG_SEC"                                      AS TARGET_LAG_SEC,
    TS_PARSE("REFRESH_START_TIME")                        AS REFRESH_START_AT,
    TS_PARSE("REFRESH_END_TIME")                          AS REFRESH_END_AT,
    TS_PARSE("DATA_TIMESTAMP")                            AS DATA_TIMESTAMP_AT,
    EPOCH_SECONDS(TS_PARSE("DATA_TIMESTAMP"), TS_PARSE("REFRESH_START_TIME"))
                                                          AS ACTUAL_LAG_SEC,
    EPOCH_SECONDS(TS_PARSE("REFRESH_START_TIME"), TS_PARSE("REFRESH_END_TIME"))
                                                          AS REFRESH_DURATION_SEC,
    -- The account these rows came from (see the ACCOUNT_OF shim).
    ACCOUNT_OF()                                          AS ACCOUNT_NAME
  FROM dynamic_table_refresh_history
dimensions:
  - name: account
    expression: ACCOUNT_NAME
    description: Snowflake account the dynamic table is defined in.
  - name: dynamic_table
    expression: QUALIFIED_NAME
    description: Fully qualified dynamic table name.
  - name: database
    expression: DATABASE_NAME
    description: Database the dynamic table lives in.
  - name: table_schema
    expression: SCHEMA_NAME
    description: Schema the dynamic table lives in.
  - name: refresh_state
    expression: REFRESH_STATE
    description: SUCCEEDED, FAILED, CANCELLED, or UPSTREAM_FAILED.
  - name: refresh_action
    expression: COALESCE(REFRESH_ACTION, 'UNKNOWN')
    description: NO_DATA, INCREMENTAL, or FULL — how the refresh was performed.
  - name: sla_status
    expression: >
      CASE WHEN TARGET_LAG_SEC IS NULL THEN 'NO_TARGET'
           WHEN ACTUAL_LAG_SEC > TARGET_LAG_SEC THEN 'BREACHED'
           ELSE 'WITHIN_TARGET' END
    description: Whether the refresh met its declared TARGET_LAG.
