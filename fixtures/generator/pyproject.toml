[project]
name = "snowobs-fixtures"
version = "0.1.0"
description = "Deterministic synthetic ACCOUNT_USAGE generator with planted phenomena"
requires-python = ">=3.12"
dependencies = [
    "snowobs-common",
    "snowobs-semantics",
    "polars>=1.17",
    "pyarrow>=18.1",
]

[project.scripts]
snowobs-generate = "snowobs_fixtures.cli:main"

[tool.uv.sources]
snowobs-common = { workspace = true }
snowobs-semantics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowobs_fixtures"]
