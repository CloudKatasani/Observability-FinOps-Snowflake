[project]
name = "snowobs"
version = "0.1.0"
description = "Observability & FinOps Platform for Snowflake — workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/*", "fixtures/generator"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api", "apps/worker", "packages/common", "packages/semantics", "packages/ingest", "packages/engines", "packages/sqlguard", "packages/agents", "packages/llm", "packages/analytics", "packages/products", "packages/artifacts", "packages/finops", "packages/snowflake_live", "fixtures/generator"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "S",                # bandit
    "N",                # pep8-naming
    "C4",               # comprehensions
    "DTZ",              # naive datetimes
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]
# Prose in docstrings and comments uses real typographic dashes and section
# marks (the spec is written that way); RUF001-003 would have us mangle them.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["snowobs_common", "snowobs_api", "snowobs_worker", "snowobs_semantics", "snowobs_ingest", "snowobs_engines", "snowobs_sqlguard", "snowobs_agents", "snowobs_llm", "snowobs_analytics", "snowobs_products", "snowobs_artifacts", "snowobs_finops", "snowobs_live", "snowobs_fixtures"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and dummy credentials in tests
# This module renders SQL *text for an operator to review and run in their own
# account* from registry-owned identifiers; the platform never executes it.
"packages/ingest/src/snowobs_ingest/export_script_gen.py" = ["S608"]
# Query()/Depends() in argument defaults is FastAPI's documented idiom, not the
# mutable-default footgun B008 exists to catch.
"apps/api/src/snowobs_api/routers/*.py" = ["B008"]
# The capability probe composes tiny SELECTs from source-registry identifiers,
# each vetted by _vet() against a bare-identifier pattern before interpolation.
"packages/snowflake_live/src/snowobs_live/probe.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ["packages/common/src", "packages/semantics/src", "packages/ingest/src", "packages/engines/src", "packages/sqlguard/src", "packages/agents/src", "packages/llm/src", "packages/analytics/src", "packages/products/src", "packages/artifacts/src", "packages/finops/src", "packages/snowflake_live/src", "apps/api/src", "apps/worker/src", "fixtures/generator/src"]
explicit_package_bases = true
# Strict typing is a rule for shipped library code (see the Definition of Done);
# test modules are exercised by running them, not by annotating their fixtures.
exclude = ["/tests/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Third-party analytics libraries ship no type information.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*", "polars.*", "arq.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["snowobs_common.*", "snowobs_semantics.*", "snowobs_ingest.*", "snowobs_sqlguard.*", "snowobs_engines.*", "snowobs_finops.*", "snowobs_live.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "snowflake: requires a live Snowflake account (skipped by default, nightly in CI)",
]

[tool.coverage.run]
source = ["packages"]

[tool.coverage.report]
show_missing = true
