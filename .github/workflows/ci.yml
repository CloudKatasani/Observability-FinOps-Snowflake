name: ci

on:
  push:
    branches: [main]
  pull_request:

# Phase 0 pipeline: lint, typecheck, unit tests, web build.
# Later phases extend this with parity tests, agent evals, image builds,
# Trivy scanning, and SBOM generation (BUILD_PROMPT §20.4).
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages --dev --frozen
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (mypy; strict on packages/)
        run: uv run mypy packages apps
      - name: Unit tests
        run: uv run pytest -m "not snowflake" --cov --cov-report=term

      # R1: a metric without a passing parity test is not shipped. This gates merges.
      - name: Dual-engine parity
        run: make test-parity

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
