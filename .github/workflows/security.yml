name: security

# CI already blocks a merge on a HIGH/CRITICAL image vulnerability. This
# workflow exists for the failure CI cannot catch: a CVE published *after* the
# code was merged. Nothing about the repository changes, and yesterday's green
# build becomes today's vulnerable deployment, so the scans run on a schedule
# as well as on change.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/pyproject.toml"
      - "uv.lock"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "Dockerfile.allinone"
      - "deploy/**"
      - ".github/workflows/security.yml"
  schedule:
    # 04:17 UTC daily. Off the hour on purpose: scheduled jobs at :00 queue
    # behind everyone else's.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: dependencies (filesystem scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A lockfile that no longer matches the manifests means the scanned
      # dependency set is not the deployed one, which makes the scan a
      # formality. Fail rather than scan the wrong tree.
      - name: The lockfile matches the manifests
        run: uv lock --check

      - name: Scan the workspace (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  secrets:
    name: secrets (history scan)
    runs-on: ubuntu-latest
    steps:
      # §27.13: a secret must never be committed. Scanning only the diff would
      # miss one that landed before this workflow existed, so the full history
      # is fetched and scanned.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the full history (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}

  image:
    name: image (rescan of the published image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allinone
          push: false
          load: true
          tags: snowobs:security
          cache-from: type=gha

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: snowobs:security
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-scheduled
